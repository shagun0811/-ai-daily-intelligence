# Explainable importance scoring. Weights must sum to 1.0.
# Do not hard-code these values in processors.
# Briefing order is not this 0–10 total: ranker.py down-ranks podcasts,
# Decoder recaps, and org-chart politics so they cannot occupy hero 1–3
# when product, model, or concrete research news exists.

weights:
  recency: 0.25
  credibility: 0.14
  relevance: 0.18
  novelty: 0.08
  technical_significance: 0.10
  industry_impact: 0.23
  research_significance: 0.02

# Mapped to a 0–10 credibility component. Tier is not importance by itself.
credibility_tier_scores:
  tier_1: 8.0
  tier_2: 6.0
  tier_3: 4.0

# Recency: full score within this many hours, then linear decay to 0.
recency:
  full_score_hours: 36
  zero_score_hours: 120
