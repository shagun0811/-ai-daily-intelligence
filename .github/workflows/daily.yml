name: Daily pipeline

on:
  schedule:
    # 01:00 Asia/Kolkata = 19:30 UTC — overnight latest, don't wait for 17:00
    - cron: "30 19 * * *"
    # 17:00 Asia/Kolkata = 11:30 UTC
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      LLM_MODEL: qwen3:4b
      EMBEDDING_PROVIDER: mock
      EXTRACT_FULL_TEXT: "false"
      SCHEDULER_ENABLED: "false"
      SCHEDULER_TIMEZONE: Asia/Kolkata
      CLOUDFLARE_AUTO_DEPLOY: "false"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
      HTTP_TIMEOUT_SECONDS: "30"
      ADI_FETCH_FFMPEG: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/aggregator.db
            data/aggregator.db-wal
            data/aggregator.db-shm
            data/reports
            site/data
            site/files
          key: adi-state-${{ github.run_id }}
          restore-keys: |
            adi-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run daily pipeline
        run: python scripts/run_pipeline.py

      - name: Confirm today's briefing was exported
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          path = Path("site/data/history.json")
          if not path.is_file():
              raise SystemExit("site/data/history.json is missing — pipeline did not export the briefing")
          payload = json.loads(path.read_text(encoding="utf-8"))
          dates = [str(item) for item in (payload.get("dates") or [])]
          print("exported dates:", dates)
          if today not in dates:
              raise SystemExit(f"today's briefing {today} is missing from export; have {dates}")
          latest = next((row for row in payload.get("reports") or [] if str(row.get("report_date")) == today), {})
          preview = str(latest.get("preview") or "")
          print(f"today={today} preview_chars={len(preview)} arxiv_mentions={preview.lower().count('arxiv')}")
          feed = Path("site/feed.xml")
          if not feed.is_file():
              raise SystemExit("site/feed.xml is missing — export did not write the RSS feed")
          body = feed.read_text(encoding="utf-8")
          if not body.lstrip().startswith("<?xml"):
              raise SystemExit("site/feed.xml is not XML")
          if "<item>" not in body:
              raise SystemExit("site/feed.xml has no <item> entries")
          print(f"rss_bytes={feed.stat().st_size} rss_items={body.count('<item>')}")
          files_dir = Path("site/files") / today
          mp4 = files_dir / f"ai-daily-intelligence-{today}-briefing.mp4"
          gif = files_dir / f"ai-daily-intelligence-{today}-briefing.gif"
          print(f"mp4={mp4.is_file()} bytes={mp4.stat().st_size if mp4.is_file() else 0}")
          print(f"gif={gif.is_file()} bytes={gif.stat().st_size if gif.is_file() else 0}")
          if not mp4.is_file() and not gif.is_file():
              print("warning: no briefing video or GIF for today (job continues)")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID lets Wrangler skip GET /memberships (API 10000 on limited tokens).
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Add the GitHub secret CLOUDFLARE_API_TOKEN so this job can update the live site."
            echo "Token needs Account → Cloudflare Pages → Edit, scoped to this account."
            echo "If deploy still returns API 10000 on /memberships, also grant User → Memberships → Read (or Account Settings → Read)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add GitHub Actions variable CLOUDFLARE_ACCOUNT_ID (Cloudflare account ID)."
            echo "Without it, Wrangler calls GET /memberships and limited tokens fail with API error 10000."
            exit 1
          fi
          # GitHub's branch is master. Wrangler infers that and deploys a *preview*
          # (master.pages.dev) unless --branch matches the Pages production branch
          # (this project uses "production"). The 26 Aug run uploaded to master
          # preview and left ai-daily-intelligence.pages.dev on 17–19 Aug.
          # Do not curl pages.dev from GitHub-hosted runners: Cloudflare returns
          # HTTP 403 there even after a successful production deploy.
          PROD_BRANCH="$(python - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/ai-daily-intelligence"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)
              branch = str((payload.get("result") or {}).get("production_branch") or "").strip()
              print(branch or "production")
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              print(f"could not read Pages project ({type(exc).__name__}); defaulting to production", file=sys.stderr)
              print("production")
          PY
          )"
          echo "Cloudflare Pages production branch: $PROD_BRANCH"
          npx --yes wrangler pages deploy site --project-name ai-daily-intelligence --commit-dirty=true --branch "$PROD_BRANCH"
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{account}"
              "/pages/projects/ai-daily-intelligence/deployments?env=production"
          )
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              print(f"wrangler deploy succeeded; could not list deployments ({type(exc).__name__})")
              raise SystemExit(0)
          rows = payload.get("result") or []
          latest = rows[0] if rows else {}
          env = str(latest.get("environment") or "")
          latest_url = str(latest.get("url") or "")
          print(f"latest production deployment env={env} url={latest_url}")
          if env and env != "production":
              print(f"warning: latest listed deployment is {env}", file=sys.stderr)
          print("Cloudflare production deployment recorded")
          PY

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/aggregator.db
            data/aggregator.db-wal
            data/aggregator.db-shm
            data/reports
            site/data
            site/files
          key: adi-state-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            data/reports/
            site/data/
            site/files/
          if-no-files-found: warn
