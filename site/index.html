<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Intelligence</title>
  <meta name="description" content="Today’s ranked AI briefing: the stories that actually moved, and why they matter.">
  <link rel="alternate" type="application/rss+xml" title="AI Daily Intelligence" href="https://ai-daily-intelligence.pages.dev/feed.xml">
  <link rel="alternate" type="application/atom+xml" title="AI Daily Intelligence (Atom)" href="https://ai-daily-intelligence.pages.dev/atom.xml">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
  </script>
  <link rel="stylesheet" href="./briefing-20260903.css">
</head>
<body>
  <a class="skip" href="#briefing">Skip to briefing</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./" id="brand-home">
        <span class="brand-kicker">Daily briefing</span>
        <span class="brand-name">AI Daily Intelligence</span>
      </a>
      <nav class="masthead-actions" aria-label="Edition">
        <a id="download-pdf" class="download-pdf" hidden>
          <span class="label-full">Download PDF</span>
          <span class="label-short">PDF</span>
        </a>
        <a id="watch-video" class="watch-video" hidden>
          <span class="label-full">Watch / Download video</span>
          <span class="label-short">Video</span>
        </a>
        <a id="rss-feed" class="rss-feed" href="./feed.xml" title="https://ai-daily-intelligence.pages.dev/feed.xml">RSS</a>
        <button type="button" id="open-archive" aria-expanded="false" aria-controls="archive-panel">Archive</button>
        <button type="button" id="theme-toggle" aria-label="Switch color theme">Dark</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="issue-head">
      <p class="kicker" id="issue-kicker">Today’s briefing</p>
      <h1 id="issue-date">Loading the briefing…</h1>
      <p class="lead-headline" id="lead-headline" hidden></p>
      <p class="dek" id="issue-dek"></p>
      <ol class="rank-strip" id="rank-strip" hidden></ol>
      <div class="issue-downloads" id="issue-downloads" hidden>
        <a id="download-pdf-hero" class="download-pdf-primary" hidden>Download PDF</a>
        <a id="watch-video-hero" class="watch-video-primary" hidden>Watch / Download video</a>
        <details class="save-more" id="save-more" hidden>
          <summary>More formats</summary>
          <div class="save-links" id="save-more-links"></div>
        </details>
      </div>
      <div class="day-nav">
        <button type="button" id="prev-day" aria-label="Previous day">‹</button>
        <div id="date-strip" class="date-strip" role="listbox" aria-label="Days with a briefing"></div>
        <button type="button" id="next-day" aria-label="Next day">›</button>
      </div>
    </section>

    <section id="archive-panel" class="archive-panel hidden" hidden>
      <div class="archive-head">
        <h2>Every published day</h2>
        <p class="muted">Open any date in the same reader. The briefing stays on the page.</p>
        <label class="date-jump">
          Jump to date
          <input id="report-date" type="date">
        </label>
      </div>
      <div id="archive-grid" class="archive-grid"></div>
    </section>

    <article id="briefing" class="briefing" aria-live="polite"></article>
    <p id="error" class="error hidden"></p>
  </main>

  <script src="./briefing-20260903.js"></script>
</body>
</html>
