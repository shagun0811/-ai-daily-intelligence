<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Daily Intelligence</title>
  <meta name="description" content="A daily briefing of what moved in AI, ranked by why it matters.">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
  </script>
  <link rel="stylesheet" href="./briefing-20260826.css">
</head>
<body>
  <a class="skip" href="#briefing">Skip to briefing</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./" id="brand-home">
        <span class="brand-kicker">Daily briefing</span>
        <span class="brand-name">AI Daily Intelligence</span>
      </a>
      <nav class="masthead-actions" aria-label="Edition">
        <button type="button" id="open-archive" aria-expanded="false" aria-controls="archive-panel">Archive</button>
        <button type="button" id="theme-toggle" aria-label="Switch color theme">Dark</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="issue-head">
      <p class="kicker" id="issue-kicker">Today in AI</p>
      <h1 id="issue-date">Loading the briefing…</h1>
      <p class="dek" id="issue-dek"></p>
      <div class="day-nav">
        <button type="button" id="prev-day" aria-label="Previous day">‹</button>
        <div id="date-strip" class="date-strip" role="listbox" aria-label="Days with a briefing"></div>
        <button type="button" id="next-day" aria-label="Next day">›</button>
      </div>
    </section>

    <section id="archive-panel" class="archive-panel hidden" hidden>
      <div class="archive-head">
        <h2>Every published day</h2>
        <p class="muted">Open any date in the same reader. The briefing stays on the page.</p>
        <label class="date-jump">
          Jump to date
          <input id="report-date" type="date">
        </label>
      </div>
      <div id="archive-grid" class="archive-grid"></div>
    </section>

    <article id="briefing" class="briefing" aria-live="polite"></article>
    <p id="error" class="error hidden"></p>
  </main>

  <script src="./briefing-20260826.js"></script>
</body>
</html>
